name: duality_music
description: Local music player for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  shared_preferences: ^2.2.2
  youtube_explode_dart: ^2.2.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1 # Gera automaticamente o ícone do Android

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  adaptive_icon_background: "#141216" # Fundo preto que combina com o logótipo
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png